name: Deploy automático

on:
  push:
    branches:
      - main
      - develop

jobs:
  test-save:
    runs-on: ubuntu-latest

    steps:
      # 1) Baixa o código do repositório (opcional aqui)
      - name: Checkout
        uses: actions/checkout@v3

      # 2) Carrega a chave SSH
      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3) Cria um arquivo de teste com data e hora
      - name: Criar arquivo de teste
        run: |
          ssh -o StrictHostKeyChecking=no \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /root/SAL_APP/pi-v_equipe2 && \
             echo \"$(date '+%Y-%m-%d %H:%M:%S')\" > deploy_test_$(date '+%Y%m%d%H%M%S').txt"
