name: Deploy automático

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout do repositório
      - name: Checkout
        uses: actions/checkout@v3

      # 2) Carrega a chave SSH
      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3) Deploy em homologação (develop)
      - name: Deploy Homolog (develop)
        if: github.ref == 'refs/heads/develop'
        run: |
          ssh -o StrictHostKeyChecking=no \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd /root/SAL_APP/pi-v_equipe2

            # Para containers orfãos e stack atual
            docker-compose -f docker-compose-homolog.yml down --remove-orphans || true

            # Limpa imagens não usadas
            docker image prune -f || true

            # Puxa as novas imagens
            docker-compose -f docker-compose-homolog.yml pull

            # Sobe o stack em background
            docker-compose -f docker-compose-homolog.yml up -d
          EOF

      # 4) Deploy em produção (main)
      - name: Deploy Prod (main)
        if: github.ref == 'refs/heads/main'
        run: |
          ssh -o StrictHostKeyChecking=no \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd /root/SAL_APP/pi-v_equipe2

            # Para containers orfãos e stack atual
            docker-compose -f docker-compose-prod.yml down --remove-orphans || true

            # Limpa imagens não usadas
            docker image prune -f || true

            # Puxa as novas imagens
            docker-compose -f docker-compose-prod.yml pull

            # Sobe o stack em background
            docker-compose -f docker-compose-prod.yml up -d
          EOF
